<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Hifz — Feedback Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f1;
    --card: #ffffff;
    --ink: #1e293b;
    --muted: #64748b;
    --primary: #0e6b5c;
    --primary-soft: #e3f0ed;
    --gold: #c9a227;
    --border: #e8e2d6;
    --danger: #b4552d;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(30, 41, 59, .06), 0 4px 16px rgba(30, 41, 59, .05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }

  /* ---------- Login gate ---------- */
  .login-box {
    max-width: 360px; margin: 80px auto 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 28px 24px; text-align: center;
  }
  .login-box h1 { margin-bottom: 16px; }
  .login-box input {
    width: 100%; padding: 11px 14px; border-radius: 999px;
    border: 1.5px solid var(--border); font-size: .95rem;
    margin-bottom: 12px; outline: none;
  }
  .login-box input:focus { border-color: var(--primary); }
  .login-box button {
    width: 100%; padding: 11px; border-radius: 999px;
    background: var(--primary); color: #fff; border: none;
    font-weight: 600; font-size: .95rem;
  }
  .login-box button:active { transform: scale(.98); }
  .login-err { color: var(--danger); font-size: .82rem; margin-top: 10px; min-height: 1em; }

  /* ---------- Dashboard ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .logout-btn {
    background: none; border: 1.5px solid var(--border); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-size: .8rem; font-weight: 600;
  }
  .refresh-btn {
    background: var(--primary-soft); border: 1.5px solid var(--primary); color: var(--primary);
    padding: 7px 14px; border-radius: 999px; font-size: .8rem; font-weight: 600;
  }
  .count { color: var(--muted); font-size: .85rem; }

  .fb-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 18px; margin-bottom: 12px;
  }
  .fb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .fb-head-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .fb-email { font-weight: 600; font-size: .88rem; word-break: break-all; }
  .fb-date { color: var(--muted); font-size: .76rem; white-space: nowrap; }
  .fb-stars { color: var(--gold); font-size: .85rem; margin-bottom: 6px; }
  .fb-msg { font-size: .92rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .fb-delete {
    background: none; border: 1.5px solid var(--border); color: var(--muted);
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .95rem; line-height: 1;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .fb-delete:hover { background: #fdf0e9; border-color: var(--danger); color: var(--danger); }
  .fb-delete:disabled { opacity: .5; cursor: default; }
  .fb-card.removing { opacity: .4; pointer-events: none; }

  .empty, .loading, .err-box { text-align: center; color: var(--muted); padding: 60px 20px; }
  .err-box { color: var(--danger); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    background: var(--card); border: 1.5px solid var(--border); color: var(--muted);
    padding: 8px 16px; border-radius: 999px; font-size: .85rem; font-weight: 600;
  }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* ---------- Users & sessions ---------- */
  .user-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 18px; margin-bottom: 12px;
  }
  .user-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .user-email { font-weight: 600; font-size: .92rem; word-break: break-all; }
  .user-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill-synced { background: var(--primary-soft); color: var(--primary); }
  .pill-nosync { background: #f1f1ee; color: var(--muted); }
  .pill-active { background: #eaf7ee; color: #1a7a3d; }
  .user-meta { font-size: .78rem; color: var(--muted); margin-bottom: 10px; }
  .session-list { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .session-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .78rem; }
  .session-row.empty-row { color: var(--muted); }
  .session-badge { font-size: .66rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge-active { background: #eaf7ee; color: #1a7a3d; }
  .badge-expired { background: #f1f1ee; color: var(--muted); }
  .session-token { font-family: monospace; color: var(--ink); background: #f6f4ee; padding: 2px 6px; border-radius: 6px; }
  .session-dates { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
  const FEEDBACK_API = '/api/admin/feedback';
  const USERS_API = '/api/admin/users';
  const KEY_STORE = 'hifz:adminKey';
  let activeTab = 'feedback';
  // Bumped on every renderShell() call so a fetch left over from a
  // superseded tab-switch (or a double "Refresh" click) can tell it's
  // stale and skip writing into a #list that's already been replaced,
  // instead of throwing on a null element.
  let renderGen = 0;

  function render() {
    const key = sessionStorage.getItem(KEY_STORE);
    if (!key) return renderLogin();
    renderShell(key);
  }

  function renderLogin(err) {
    document.getElementById('wrap').innerHTML = `
      <div class="login-box">
        <h1>Admin</h1>
        <input type="password" id="pw" placeholder="Admin key" autofocus>
        <button onclick="submitLogin()">Sign in</button>
        <div class="login-err">${err ? esc(err) : ''}</div>
      </div>`;
    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });
  }

  async function submitLogin() {
    const pw = document.getElementById('pw').value.trim();
    if (!pw) return;
    sessionStorage.setItem(KEY_STORE, pw);
    renderShell(pw);
  }

  function logout() {
    sessionStorage.removeItem(KEY_STORE);
    render();
  }

  function switchTab(tab) {
    activeTab = tab;
    renderShell(sessionStorage.getItem(KEY_STORE));
  }

  function renderShell(key) {
    const titles = { feedback: 'Feedback', users: 'Users & Sessions' };
    const subs = {
      feedback: 'Submissions from the Hifz feedback form',
      users: 'Accounts that have signed in via magic link, and their sessions'
    };
    document.getElementById('wrap').innerHTML = `
      <div class="toolbar">
        <div>
          <h1>${titles[activeTab]}</h1>
          <div class="sub">${subs[activeTab]}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="refresh-btn" onclick="renderShell(sessionStorage.getItem('${KEY_STORE}'))">Refresh</button>
          <button class="logout-btn" onclick="logout()">Sign out</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn ${activeTab === 'feedback' ? 'active' : ''}" onclick="switchTab('feedback')">Feedback</button>
        <button class="tab-btn ${activeTab === 'users' ? 'active' : ''}" onclick="switchTab('users')">Users &amp; Sessions</button>
      </div>
      <div class="loading" id="list">Loading…</div>`;

    const gen = ++renderGen;
    if (activeTab === 'feedback') loadFeedback(key, gen);
    else loadUsers(key, gen);
  }

  async function loadFeedback(key, gen) {
    let res;
    try {
      res = await fetch(FEEDBACK_API, { headers: { 'X-Admin-Key': key } });
    } catch {
      if (gen !== renderGen) return;
      document.getElementById('list').outerHTML = '<div class="err-box">Network error — try refreshing.</div>';
      return;
    }
    if (gen !== renderGen) return;   // a later tab-switch/refresh has already superseded this load

    if (res.status === 401) {
      sessionStorage.removeItem(KEY_STORE);
      renderLogin('Incorrect admin key.');
      return;
    }
    if (!res.ok) {
      document.getElementById('list').outerHTML = '<div class="err-box">Something went wrong loading feedback.</div>';
      return;
    }

    const data = await res.json();
    if (gen !== renderGen) return;
    const rows = data.feedback || [];
    const listEl = document.getElementById('list');
    if (!rows.length) {
      listEl.outerHTML = '<div class="empty">No feedback submitted yet.</div>';
      return;
    }
    listEl.outerHTML = `<div class="count" id="fb-count">${rows.length} submission${rows.length === 1 ? '' : 's'}</div>` +
      rows.map(r => `
        <div class="fb-card" id="fb-card-${r.id}">
          <div class="fb-head">
            <div class="fb-head-main">
              <span class="fb-email">${esc(r.email)}</span>
              <span class="fb-date">${esc(formatDate(r.created_at))}</span>
            </div>
            <button class="fb-delete" onclick="deleteFeedback(${r.id})" aria-label="Delete" title="Delete">✕</button>
          </div>
          ${r.rating ? `<div class="fb-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>` : ''}
          <div class="fb-msg">${esc(r.message)}</div>
        </div>`).join('');
  }

  async function deleteFeedback(id) {
    if (!confirm('Delete this feedback? This can\'t be undone.')) return;
    const key = sessionStorage.getItem(KEY_STORE);
    const card = document.getElementById('fb-card-' + id);
    const btn = card ? card.querySelector('.fb-delete') : null;
    if (card) card.classList.add('removing');
    if (btn) btn.disabled = true;

    let res;
    try {
      res = await fetch(FEEDBACK_API + '/' + id, { method: 'DELETE', headers: { 'X-Admin-Key': key } });
    } catch {
      if (card) card.classList.remove('removing');
      if (btn) btn.disabled = false;
      alert('Network error — try again.');
      return;
    }

    if (res.status === 401) {
      sessionStorage.removeItem(KEY_STORE);
      renderLogin('Incorrect admin key.');
      return;
    }
    if (!res.ok) {
      if (card) card.classList.remove('removing');
      if (btn) btn.disabled = false;
      alert('Could not delete that entry — try again.');
      return;
    }

    if (card) card.remove();
    const countEl = document.getElementById('fb-count');
    const remaining = document.querySelectorAll('.fb-card').length;
    if (countEl) countEl.textContent = `${remaining} submission${remaining === 1 ? '' : 's'}`;
    if (!remaining) {
      const wrap = document.getElementById('wrap');
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No feedback submitted yet.';
      wrap.appendChild(empty);
      if (countEl) countEl.remove();
    }
  }

  async function loadUsers(key, gen) {
    let res;
    try {
      res = await fetch(USERS_API, { headers: { 'X-Admin-Key': key } });
    } catch {
      if (gen !== renderGen) return;
      document.getElementById('list').outerHTML = '<div class="err-box">Network error — try refreshing.</div>';
      return;
    }
    if (gen !== renderGen) return;   // a later tab-switch/refresh has already superseded this load

    if (res.status === 401) {
      sessionStorage.removeItem(KEY_STORE);
      renderLogin('Incorrect admin key.');
      return;
    }
    if (!res.ok) {
      document.getElementById('list').outerHTML = '<div class="err-box">Something went wrong loading users.</div>';
      return;
    }

    const data = await res.json();
    if (gen !== renderGen) return;
    const users = data.users || [];
    const listEl = document.getElementById('list');
    if (!users.length) {
      listEl.outerHTML = '<div class="empty">No one has signed in yet.</div>';
      return;
    }
    listEl.outerHTML = `<div class="count">${users.length} account${users.length === 1 ? '' : 's'}</div>` +
      users.map(userCardHTML).join('');
  }

  function userCardHTML(u) {
    const sessionsHTML = u.sessions.length
      ? u.sessions.map(s => `
        <div class="session-row">
          <span class="session-badge ${s.active ? 'badge-active' : 'badge-expired'}">${s.active ? 'Active' : 'Expired'}</span>
          <span class="session-token">${esc(s.tokenPrefix)}</span>
          <span class="session-dates">Signed in ${esc(formatDate(s.created_at))} · expires ${esc(formatDate(s.expires_at))}</span>
        </div>`).join('')
      : '<div class="session-row empty-row">No sessions</div>';

    const syncedMeta = u.synced
      ? ` · synced ${esc(formatDate(u.state_updated_at))} (${formatBytes(u.state_size_bytes)})`
      : '';

    return `
      <div class="user-card">
        <div class="user-head">
          <span class="user-email">${esc(u.email)}</span>
          <span class="user-badges">
            ${u.synced ? '<span class="pill pill-synced">Synced</span>' : '<span class="pill pill-nosync">Not synced</span>'}
            ${u.active_session_count > 0 ? `<span class="pill pill-active">${u.active_session_count} active session${u.active_session_count === 1 ? '' : 's'}</span>` : ''}
          </span>
        </div>
        <div class="user-meta">Joined ${esc(formatDate(u.created_at))} · ${u.session_count} session${u.session_count === 1 ? '' : 's'} total${syncedMeta}</div>
        <div class="session-list">${sessionsHTML}</div>
      </div>`;
  }

  function formatBytes(n) {
    if (!n) return '0 B';
    if (n < 1024) return n + ' B';
    return (n / 1024).toFixed(1) + ' KB';
  }

  function formatDate(s) {
    if (!s) return '—';
    try {
      return new Date(s.replace(' ', 'T') + 'Z').toLocaleString();
    } catch { return s; }
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  render();
</script>
</body>
</html>
